<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Exalyte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/components.css">
<style>
.auth-container {
  min-height: calc(100vh - 64px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

.auth-card {
  max-width: 420px;
  width: 100%;
}

.auth-header {
  text-align: center;
  margin-bottom: 32px;
}

.auth-header h1 {
  font-size: 1.8rem;
  margin-bottom: 8px;
}

.auth-header p {
  color: var(--muted);
  font-size: 0.9rem;
}

.auth-switch {
  text-align: center;
  margin-top: 24px;
  color: var(--muted);
  font-size: 0.85rem;
}

.auth-switch a {
  color: var(--accent2);
  text-decoration: none;
}

.auth-switch a:hover {
  text-decoration: underline;
}

.password-wrapper {
  position: relative;
}

.toggle-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
}

.toggle-password svg {
  width: 18px;
  height: 18px;
  stroke: var(--muted);
  stroke-width: 1.5;
  fill: none;
}
</style>
</head>
<body>

<header class="sticky-header">
  <a href="/" class="logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect x="1.5" y="1.5" width="25" height="25" rx="7" fill="#0c0c16" stroke="#1e1e32" stroke-width="1.2"/>
      <path d="M9 18l5-11 5 11" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="11" y1="14" x2="17" y2="14" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="14" cy="21" r="1.3" fill="#818cf8"/>
    </svg>
    Exalyte
  </a>
  <div></div>
</header>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Sign in to continue your learning journey</p>
    </div>
    
    <div class="card">
      <div class="card-body">
        <div id="alert" class="alert" style="display: none"></div>
        
        <div id="loginForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="password-wrapper">
              <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Sign In</button>
        </div>
        
        <div id="signupForm" style="display: none">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="signupName" class="form-input" placeholder="John Doe">
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="signupEmail" class="form-input" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="password-wrapper">
              <input type="password" id="signupPassword" class="form-input" placeholder="Minimum 6 characters">
              <button type="button" class="toggle-password" onclick="togglePassword('signupPassword')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="handleSignup()">Create Account</button>
        </div>
        
        <div class="auth-switch">
          <span id="switchText">Don't have an account?</span>
          <a href="#" onclick="toggleAuthMode()" id="switchLink">Create one</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/security.js"></script>
<script src="/js/common.js"></script>
<script>
let isLoginMode = true;

function toggleAuthMode() {
  isLoginMode = !isLoginMode;
  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');
  const switchText = document.getElementById('switchText');
  const switchLink = document.getElementById('switchLink');
  
  if (isLoginMode) {
    loginForm.style.display = 'block';
    signupForm.style.display = 'none';
    switchText.textContent = "Don't have an account?";
    switchLink.textContent = 'Create one';
  } else {
    loginForm.style.display = 'none';
    signupForm.style.display = 'block';
    switchText.textContent = 'Already have an account?';
    switchLink.textContent = 'Sign in';
  }
  document.getElementById('alert').style.display = 'none';
}

function showAlert(message, isError = true) {
  const alert = document.getElementById('alert');
  alert.textContent = message;
  alert.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
  alert.style.display = 'block';
  setTimeout(() => {
    alert.style.display = 'none';
  }, 5000);
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  
  if (!email || !password) {
    showAlert('Please fill in all fields');
    return;
  }
  
  const result = await secureFetch('/api/auth/login', {
    method: 'POST',
    body: JSON.stringify({ email, password })
  });
  
  if (result.error) {
    showAlert(result.error);
    return;
  }
  
  if (result.token && result.user) {
    setSecureToken(result.token);
    setSecureUser(result.user);
    
    // Register device fingerprint
    await registerDeviceFingerprint(email);
    
    if (result.user.is_admin) {
      window.location.href = '/admin.html';
    } else {
      window.location.href = '/dashboard.html';
    }
  }
}

async function handleSignup() {
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  
  if (!name || !email || !password) {
    showAlert('Please fill in all fields');
    return;
  }
  
  if (password.length < 6) {
    showAlert('Password must be at least 6 characters');
    return;
  }
  
  // Check for multiple accounts
  const multipleCheck = await validateNoMultipleAccounts(email);
  if (!multipleCheck.valid) {
    showAlert(multipleCheck.error);
    return;
  }
  
  const result = await secureFetch('/api/auth/signup', {
    method: 'POST',
    body: JSON.stringify({ name, email, password })
  });
  
  if (result.error) {
    showAlert(result.error);
    return;
  }
  
  if (result.token && result.user) {
    // Register device fingerprint
    await registerDeviceFingerprint(email);
    
    showAlert('Account created successfully! Redirecting...', false);
    setTimeout(() => {
      setSecureToken(result.token);
      setSecureUser(result.user);
      window.location.href = '/dashboard.html';
    }, 1500);
  }
}

function togglePassword(inputId) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') {
    input.type = 'text';
  } else {
    input.type = 'password';
  }
}

// Guest redirect (if already logged in)
if (isLoggedIn()) {
  const user = getCurrentUser();
  if (user?.is_admin) {
    window.location.href = '/admin.html';
  } else {
    window.location.href = '/dashboard.html';
  }
}
</script>
</body>
</html>
